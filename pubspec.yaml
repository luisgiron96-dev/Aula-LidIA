name: aula_lidia
description: "Plataforma educativa híbrida Aula Lid-IA"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.1
  file_picker: ^10.3.7
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

dependency_overrides:
  flutter_plugin_android_lifecycle: ^2.0.24